# Install in sites-available, then let Certbot add HTTPS for this hostname only.
# This map must be included in Nginx's http context (as sites-enabled normally is).
map $uri $senswear_web_app_cache_control {
    default "no-cache";
    / "no-store";
    /index.html "no-store";
    /revision.txt "no-store";
    ~^/assets/[^/]+-[A-Za-z0-9_-]+[.](js|css|woff2?)$ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.sens-wear.com;

    root /var/www/senswear-web-app/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/app.sens-wear.com.access.log;
    error_log /var/log/nginx/app.sens-wear.com.error.log;

    # Keep these at server scope so every location inherits the same policy.
    add_header Cache-Control $senswear_web_app_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "bluetooth=(self), camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'" always;

    location = /revision.txt {
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Hash navigation does not need an HTML fallback for missing asset paths.
    location / {
        try_files $uri $uri/ =404;
    }
}
